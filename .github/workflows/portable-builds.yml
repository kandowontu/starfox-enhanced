name: Portable platform builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive the artifacts
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 runtime and standalone asset builder
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build/asset-builder -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTARFOX_BUILD_TESTS=OFF `
            -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF
          cmake --build build/asset-builder --target starfox_pc starfox_asset_builder
      - name: Verify standalone Windows imports
        shell: pwsh
        run: |
          $objdump = (Get-Command objdump.exe -ErrorAction Stop).Source
          foreach ($binary in @(
              'build/asset-builder/starfox_pc.exe',
              'build/asset-builder/starfox_asset_builder.exe')) {
            $imports = (& $objdump -p $binary | Out-String)
            if ($imports -match 'libgcc_s_|libstdc\+\+|libwinpthread') {
              throw "$binary still depends on a MinGW runtime DLL"
            }
          }
          & build/asset-builder/starfox_asset_builder.exe
          if ($LASTEXITCODE -ne 2) {
            throw 'asset builder did not launch and print its usage'
          }
          $global:LASTEXITCODE = 0
      - name: Package runtime and builder
        shell: pwsh
        run: |
          $runtime = 'StarFoxEnhanced-0.0.2-windows-x64'
          cmake --install build/asset-builder --prefix $runtime
          Compress-Archive -Path "$runtime/*" -DestinationPath "$runtime.zip"
          $builder = 'StarFoxAssetBuilder-0.0.2-windows-x64'
          New-Item -ItemType Directory -Force $builder | Out-Null
          Copy-Item build/asset-builder/starfox_asset_builder.exe $builder/
          Copy-Item platform/mobile/ASSET_BUILDER.md $builder/README.md
          Copy-Item THIRD_PARTY_NOTICES.md $builder/
          Compress-Archive -Path "$builder/*" -DestinationPath "$builder.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.2-windows-x64
          path: StarFoxEnhanced-0.0.2-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxAssetBuilder-0.0.2-windows-x64
          path: StarFoxAssetBuilder-0.0.2-windows-x64.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.2-windows-x64.zip \
            StarFoxAssetBuilder-0.0.2-windows-x64.zip --clobber

  windows-x86:
    name: Windows x86 runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned LLVM-MinGW toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest `
            'https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip' `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $root = (Get-ChildItem -LiteralPath $directory -Directory |
            Select-Object -First 1).FullName
          "LLVM_MINGW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and install
        shell: pwsh
        run: |
          ./tools/build_windows_x86.ps1 `
            -LlvmMingwRoot $env:LLVM_MINGW_ROOT `
            -BuildDirectory build/windows-x86-release `
            -InstallDirectory dist/StarFoxEnhanced-windows-x86
      - name: Verify and package runtime
        shell: pwsh
        run: |
          $binary = 'dist/StarFoxEnhanced-windows-x86/starfox_pc.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw 'x86 runtime was not installed'
          }
          $readobj = Join-Path $env:LLVM_MINGW_ROOT 'bin/llvm-readobj.exe'
          $headers = & $readobj --file-headers $binary | Out-String
          if ($headers -notmatch 'IMAGE_FILE_MACHINE_I386') {
            throw 'packaged runtime is not a 32-bit x86 PE image'
          }
          $package = 'StarFoxEnhanced-0.0.2-windows-x86'
          Move-Item dist/StarFoxEnhanced-windows-x86 $package
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.2-windows-x86
          path: StarFoxEnhanced-0.0.2-windows-x86.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.2-windows-x86.zip --clobber

  xbox-uwp-x64:
    name: Xbox UWP x64 (Developer Mode)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build signed Xbox Developer Mode package
        shell: pwsh
        run: |
          ./tools/build_xbox_uwp.ps1 `
            -BuildDirectory build/xbox-uwp-x64 `
            -InstallDirectory dist/StarFoxEnhanced-xbox-uwp-x64
      - name: Verify and package UWP output
        shell: pwsh
        run: |
          $root = 'dist/StarFoxEnhanced-xbox-uwp-x64'
          $package = Get-ChildItem -LiteralPath $root -File |
            Where-Object { $_.Extension -in '.appx', '.msix', '.appxbundle', '.msixbundle' } |
            Select-Object -First 1
          if ($null -eq $package -or $package.Length -eq 0) {
            throw 'Xbox UWP package is missing'
          }
          if (-not (Test-Path -LiteralPath "$root/StarFoxEnhanced-UWP-Development.cer")) {
            throw 'Xbox UWP public development certificate is missing'
          }
          Compress-Archive -Path "$root/*" `
            -DestinationPath StarFoxEnhanced-0.0.2-xbox-uwp-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.2-xbox-uwp-x64
          path: StarFoxEnhanced-0.0.2-xbox-uwp-x64.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.2-xbox-uwp-x64.zip --clobber

  linux-x64:
    name: Linux x64 native runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libudev-dev
      - name: Build, test, and install
        shell: bash
        run: |
          chmod +x tools/build_linux.sh
          tools/build_linux.sh "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/starfox-enhanced-linux-x64" \
            "$GITHUB_WORKSPACE/dist/StarFoxEnhanced-linux-x64"
      - name: Verify and package runtime
        shell: bash
        run: |
          binary="dist/StarFoxEnhanced-linux-x64/starfox_pc"
          test -x "${binary}"
          test -x dist/StarFoxEnhanced-linux-x64/starfox_asset_builder
          file "${binary}" | grep -q 'ELF 64-bit.*x86-64'
          ! ldd "${binary}" | grep -q 'not found'
          cmake -E tar cf StarFoxEnhanced-0.0.2-linux-x64.zip \
            --format=zip dist/StarFoxEnhanced-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.2-linux-x64
          path: StarFoxEnhanced-0.0.2-linux-x64.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.2-linux-x64.zip --clobber

  macos-universal:
    name: macOS universal (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          chmod +x tools/build_apple.sh
          tools/build_apple.sh "$GITHUB_WORKSPACE" macos
      - name: Verify and package application
        shell: bash
        run: |
          app="build/macos-universal/Release/StarFoxEnhanced.app"
          binary="${app}/Contents/MacOS/StarFoxEnhanced"
          test -d "${app}"
          test -x "${binary}"
          plutil -lint "${app}/Contents/Info.plist"
          archs="$(lipo -archs "${binary}")"
          [[ " ${archs} " == *" arm64 "* ]]
          [[ " ${archs} " == *" x86_64 "* ]]
          package="StarFoxEnhanced-0.0.2-macos-universal"
          mkdir -p "${package}"
          cp -R "${app}" "${package}/"
          cp build/macos-universal/Release/starfox_asset_builder "${package}/"
          cp platform/mobile/ASSET_BUILDER.md "${package}/ASSET_BUILDER.md"
          cp README.md CREDITS.md THIRD_PARTY_NOTICES.md "${package}/"
          ditto -c -k --sequesterRsrc --keepParent "${package}" "${package}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.2-macos-universal
          path: StarFoxEnhanced-0.0.2-macos-universal.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.2-macos-universal.zip --clobber

  ios-device:
    name: iOS arm64 device (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device application
        shell: bash
        run: |
          chmod +x tools/build_apple.sh
          tools/build_apple.sh "$GITHUB_WORKSPACE" ios
      - name: Verify and package application
        shell: bash
        run: |
          app="build/ios/Release-iphoneos/StarFoxEnhanced.app"
          binary="${app}/StarFoxEnhanced"
          test -d "${app}"
          test -f "${binary}"
          plutil -lint "${app}/Info.plist"
          [[ " $(lipo -archs "${binary}") " == *" arm64 "* ]]
          package="StarFoxEnhanced-0.0.2-ios-arm64-unsigned"
          mkdir -p "${package}/Payload"
          cp -R "${app}" "${package}/Payload/"
          cp platform/apple/IOS_INSTALL.md "${package}/README.md"
          ditto -c -k --sequesterRsrc --keepParent "${package}" "${package}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.2-ios-arm64-unsigned
          path: StarFoxEnhanced-0.0.2-ios-arm64-unsigned.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.2-ios-arm64-unsigned.zip --clobber

  android-arm64:
    name: Android arm64 development APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools platforms;android-35 build-tools;35.0.0
            ndk;28.2.13676358
          log-accepted-android-sdk-licenses: 'false'
      - name: Build installable development APK
        shell: bash
        run: |
          chmod +x tools/build_android.sh platform/android/gradlew
          tools/build_android.sh "$GITHUB_WORKSPACE" debug
      - name: Verify APK payload
        shell: bash
        run: |
          apk="dist/StarFoxEnhanced-android-arm64.apk"
          test -f "${apk}"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "${apk}"
          unzip -l "${apk}" | grep -q 'lib/arm64-v8a/libmain.so'
          unzip -l "${apk}" | grep -q 'lib/arm64-v8a/libSDL3.so'
          cp "${apk}" StarFoxEnhanced-0.0.2-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.2-android-arm64
          path: StarFoxEnhanced-0.0.2-android-arm64.apk
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.2-android-arm64.apk --clobber

  switch-homebrew:
    name: Nintendo Switch homebrew NRO
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
      - name: Build native Switch application
        shell: bash
        run: |
          chmod +x tools/build_switch.sh
          tools/build_switch.sh "$GITHUB_WORKSPACE"
      - name: Verify and package NRO
        shell: bash
        run: |
          nro="dist/StarFoxEnhanced-switch/switch/StarFoxEnhanced/StarFoxEnhanced.nro"
          test -s "${nro}"
          test -f dist/StarFoxEnhanced-switch/package_switch_nsp.ps1
          cmake -E tar cf \
            StarFoxEnhanced-0.0.2-switch-homebrew.zip \
            --format=zip dist/StarFoxEnhanced-switch
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.2-switch-homebrew
          path: StarFoxEnhanced-0.0.2-switch-homebrew.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: StarFoxEnhanced-0.0.2-switch-homebrew.zip
