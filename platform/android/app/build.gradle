plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starfox.enhanced'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.starfox.enhanced'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.0.6.5'

        externalNativeBuild {
            cmake {
                targets 'starfox_pc'
                arguments '-DANDROID_PLATFORM=android-26',
                    '-DANDROID_STL=c++_shared',
                    '-DSTARFOX_BUILD_TESTS=OFF',
                    '-DSTARFOX_BUILD_RUNTIME=ON',
                    '-DSTARFOX_EMBED_RUNTIME_ASSETS=ON',
                    '-DSTARFOX_PACKAGE_MSU1_MUSIC=OFF'
                abiFilters 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        permanent {
            if (System.getenv('ANDROID_RELEASE_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_RELEASE_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_RELEASE_PASSWORD')
                keyAlias 'starfox-enhanced'
                keyPassword System.getenv('ANDROID_RELEASE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            if (System.getenv('ANDROID_RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.permanent
            }
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.permanent
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('../../../CMakeLists.txt')
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation files('libs/SDL3-3.4.14.aar')
}
