plugins { id 'com.android.application' }

android {
    namespace 'com.starfox.enhanced.quest'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.starfox.enhanced.quest'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName '0.0.8-vr-dev'
        externalNativeBuild {
            cmake {
                targets 'starfox_quest'
                arguments '-DANDROID_STL=c++_shared',
                    '-DSTARFOX_BUILD_VR=ON', '-DSTARFOX_BUILD_RUNTIME=OFF',
                    '-DSTARFOX_BUILD_TESTS=OFF', '-DSTARFOX_BUILD_TOOLS=OFF',
                    '-DSTARFOX_EMBED_RUNTIME_ASSETS=ON', '-DSTARFOX_PACKAGE_MSU1_MUSIC=OFF'
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildFeatures { prefab true }
    packaging {
        jniLibs {
            // NDK link stubs are not runtime implementations. Resolve these
            // platform libraries from the headset OS, never from the APK.
            excludes += ['**/libandroid.so', '**/liblog.so']
        }
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            // The default .cxx/RelWithDebInfo path made Vulkan-Headers'
            // FetchContent stamp exceed Ninja's Windows 260-character limit.
            // Keep staging inside ignored build/, with an optional short-path
            // override for checkouts whose parent directory is even longer.
            buildStagingDirectory file(System.getenv('STARFOX_QUEST_BUILD_ROOT') ?: '../../build/q')
        }
    }
    signingConfigs {
        permanent {
            if (System.getenv('ANDROID_RELEASE_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_RELEASE_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_RELEASE_PASSWORD')
                keyAlias 'starfox-enhanced'
                keyPassword System.getenv('ANDROID_RELEASE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            // The source simulation is too expensive at -O0 for headset timing.
            // Keep a debuggable APK and native symbols while testing real FPS.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_C_FLAGS_DEBUG=-g -O2',
                        '-DCMAKE_CXX_FLAGS_DEBUG=-g -O2'
                }
            }
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.permanent
            }
        }
    }
}
dependencies {
    implementation files('../android/app/libs/SDL3-3.4.14.aar')
}
